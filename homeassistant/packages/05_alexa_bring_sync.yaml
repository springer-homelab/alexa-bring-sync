# ==============================================================================
# Package: Alexa -> Bring! Sync Hub (100% Lokal in Home Assistant)
# ==============================================================================

input_text:
  bring_last_called_timestamp:
    name: "Bring Last Called Timestamp"
    icon: mdi:clock-outline

shell_command:
  bring_voice_sync: >-
    python3 /config/scripts/bring_sync.py "{{ spoken_text }}"
  bring_fetch_active: >-
    python3 /config/scripts/bring_sync.py --fetch-active

command_line:
  - sensor:
      name: "Bring Active Items"
      unique_id: bring_active_items
      command: "python3 /config/scripts/bring_sync.py --fetch-active"
      value_template: "{{ value_json.count | default(0) }}"
      json_attributes:
        - items
      scan_interval: 120

automation:
  - id: alexa_bring_voice_sync
    alias: "Alexa -> Bring! Sprach-Sniffer (Echtzeit Lokal)"
    description: "Fängt Spracheingaben für die Einkaufsliste ab und synchronisiert Hinzufügen/Löschen zu 100% lokal nach Bring!."
    mode: queued
    max: 10
    trigger:
      - platform: state
        entity_id:
          - media_player.echo_dot
          - media_player.this_device
        attribute: last_called_timestamp
    condition:
      - condition: template
        value_template: >-
          {% set cur_ts = trigger.to_state.attributes.last_called_timestamp | default('', true) | string %}
          {% set last_ts = states('input_text.bring_last_called_timestamp') | default('', true) | string %}
          {% set raw = trigger.to_state.attributes.last_called_summary | default('', true) | string | lower | trim %}
          {% set is_question = raw.startswith(('was ', 'wie ', 'wo ', 'wann ', 'warum ', 'wieso ', 'weshalb ', 'wer ', 'welche ', 'ist ', 'sind ', 'gibt ', 'hast ', 'kannst ', 'lies ', 'zeige ', 'öffne ', 'starte ', 'spiel ', 'stelle ', 'stell ')) or raw.endswith('?') %}
          {% set has_shopping_intent = (
            'einkaufsliste' in raw or 'einkaufszettel' in raw or 'bring liste' in raw or 'bringliste' in raw
            or 'auf die liste' in raw or 'auf den zettel' in raw or 'von der liste' in raw or 'von dem zettel' in raw or 'von meiner liste' in raw
            or raw.startswith(('setze ', 'setz ', 'packe ', 'pack ', 'schreibe ', 'schreib ', 'füge ', 'füg ', 'lösche ', 'lösch ', 'entferne ', 'entfern ', 'streiche ', 'streich ', 'kaufe ', 'kauf ', 'wir brauchen noch ', 'wir benötigen noch '))
          ) %}
          {{ cur_ts != last_ts and cur_ts | length > 0 and not is_question and has_shopping_intent }}
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.bring_last_called_timestamp
        data:
          value: "{{ trigger.to_state.attributes.last_called_timestamp | string }}"
      - service: shell_command.bring_voice_sync
        data:
          spoken_text: >-
            {{ trigger.to_state.attributes.last_called_summary | replace('"', '') | replace("'", "") }}
      - service: homeassistant.update_entity
        target:
          entity_id: sensor.bring_active_items
      - service: automation.trigger
        target:
          entity_id: automation.bring_to_amazon_mirror_reconcile
      - delay: 4
      - service: automation.trigger
        target:
          entity_id: automation.bring_to_amazon_mirror_reconcile

  - id: bring_to_amazon_mirror_reconcile
    alias: "Bring! -> Amazon: 1-Way Mirror Reconciler"
    description: "Hält Amazon's Einkaufsliste 100% synchron mit Bring! und entfernt abgehakte Artikel lautlos."
    mode: restart
    trigger:
      - platform: state
        entity_id: todo.alexa_todo_shop
      - platform: state
        entity_id: sensor.bring_active_items
      - platform: time_pattern
        minutes: "/2"
      - platform: homeassistant
        event: start
    condition:
      - condition: template
        value_template: "{{ states('todo.alexa_todo_shop') not in ['unavailable', 'unknown', 'none'] }}"
    action:
      - service: todo.get_items
        target:
          entity_id: todo.alexa_todo_shop
        data:
          status: needs_action
        response_variable: alexa_res
      - variables:
          bring_names: "{{ state_attr('sensor.bring_active_items', 'items') | default([], true) }}"
          alexa_items: "{{ alexa_res['todo.alexa_todo_shop']['items'] | default([], true) }}"

      - repeat:
          for_each: >-
            {% set ns = namespace(remaining=bring_names, names=[]) %}
            {% for a in alexa_items %}
              {% set s = a.summary | trim %}
              {% if s in ns.remaining %}
                {% set idx = ns.remaining.index(s) %}
                {% set ns.remaining = ns.remaining[:idx] + ns.remaining[idx + 1:] %}
              {% else %}
                {% set ns.names = ns.names + [s] %}
              {% endif %}
            {% endfor %}
            {{ ns.names | to_json }}
          sequence:
            - service: todo.remove_item
              target:
                entity_id: todo.alexa_todo_shop
              data:
                item: "{{ repeat.item }}"

      - repeat:
          for_each: >-
            {% set ns = namespace(remaining=bring_names) %}
            {% for a in alexa_items %}
              {% set s = a.summary | trim %}
              {% if s in ns.remaining %}
                {% set idx = ns.remaining.index(s) %}
                {% set ns.remaining = ns.remaining[:idx] + ns.remaining[idx + 1:] %}
              {% endif %}
            {% endfor %}
            {{ ns.remaining | to_json }}
          sequence:
            - service: todo.add_item
              target:
                entity_id: todo.alexa_todo_shop
              data:
                item: "{{ repeat.item }}"
